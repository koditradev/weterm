<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WETERM Web Terminal</title>
    <!-- Include Xterm.js Styles and Script -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: #111; margin: 20px; }
        #terminal { width: 100%; height: 500px; }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        // Initialize xterm console interface
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#1e1e1e' }
        });
        term.open(document.getElementById('terminal'));

        // Point to the backend python web-socket container
        const ws = new WebSocket("ws://localhost:8765");

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        term.onData((data) => {
            ws.send(data);
        });

        ws.onclose = () => {
            term.write('\n\r[WETERM Connection Closed]\n\r');
        };
    </script>
</body>
</html>
